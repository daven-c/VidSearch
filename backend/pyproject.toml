[project]
name = "vidsearch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av>=19.0.1",
    "coremltools>=9.0; sys_platform == 'darwin'",
    "fastapi>=0.149.0",
    "huggingface-hub>=2.2.0",
    "lancedb>=0.40.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "protobuf>=7.36.2",
    "pyarrow>=26.0.0",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers>=4.49",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's File()/Query() defaults are idiomatic
