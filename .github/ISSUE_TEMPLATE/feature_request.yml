name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that VidSearch doesn't support well today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How could it work? If it affects retrieval quality or speed, which benchmark would show the improvement?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
